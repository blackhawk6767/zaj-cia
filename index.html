
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moje 31 gier</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 25px;
  background: #101522;
  color: white;
  font-family: Arial, sans-serif;
}
h1 { text-align: center; color: #65b5ff; }
.top {
  text-align: center;
  margin: 20px;
}
button {
  background: #268cff;
  color: white;
  border: 0;
  padding: 11px 18px;
  border-radius: 8px;
  cursor: pointer;
  margin: 5px;
}
button:hover { background: #0865ce; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 18px;
  max-width: 1200px;
  margin: auto;
}
.game {
  background: #202b40;
  border-radius: 14px;
  padding: 12px;
  text-align: center;
}
.game img {
  width: 100%;
  height: 130px;
  object-fit: cover;
  background: #111827;
  border-radius: 9px;
}
.game input[type="text"] {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 7px;
  border: none;
}
.game input[type="file"] {
  width: 100%;
  font-size: 11px;
}
.number { color: #8ebfff; }
</style>
</head>
<body>

<h1>🎮 MOJE GRY</h1>
<div class="top">
  <p>Moja kolekcja 31 gier</p>
  <button onclick="addGame()">➕ Dodaj grę</button>
</div>

<div class="grid" id="games"></div>

<script>
const games = document.getElementById("games");

function createGame(name = "", photo = "") {
  const card = document.createElement("div");
  card.className = "game";

  const number = games.children.length + 1;

  const img = document.createElement("img");
  img.src = photo || "";
  img.alt = "Obraz gry";

  const title = document.createElement("h3");
  title.textContent = "Gra " + number;
  title.className = "number";

  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = "Wpisz nazwę gry";
  input.value = name;
  input.addEventListener("input", () => {
    title.textContent = input.value || "Gra " + number;
    save();
  });

  const file = document.createElement("input");
  file.type = "file";
  file.accept = "image/*";

  file.addEventListener("change", () => {
    const selected = file.files[0];
    if (!selected) return;

    const reader = new FileReader();
    reader.onload = () => {
      img.src = reader.result;
      save();
    };
    reader.readAsDataURL(selected);
  });

  card.append(img, title, input, file);
  games.appendChild(card);
}

function addGame() {
  createGame();
  save();
}

function save() {
  const data = [...games.children].map(card => ({
    name: card.querySelector('input[type="text"]').value,
    photo: card.querySelector("img").src
  }));
  try {
    localStorage.setItem("mojeGry", JSON.stringify(data));
  } catch (e) {
    alert("Brak miejsca na zapis zdjęć. Spróbuj użyć mniejszych obrazków.");
  }
}

function load() {
  let data;
  try {
    data = JSON.parse(localStorage.getItem("mojeGry"));
  } catch (e) {}

  if (Array.isArray(data)) {
    data.forEach(game => createGame(game.name, game.photo));
  } else {
    for (let i = 0; i < 31; i++) createGame();
  }
}

load();
</script>

</body>
</html>
